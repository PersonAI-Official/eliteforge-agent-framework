[workspace]
members = [
    "crates/capability/eliteforge-agent-capability-development",
    "crates/capability/eliteforge-agent-capability-chunking",
    "crates/capability/eliteforge-agent-capability-auto-routing",
    "crates/capability/eliteforge-agent-capability-external",
    "crates/capability/eliteforge-agent-capability-personai",
    "crates/capability/eliteforge-agent-capability-remote-access",
    "crates/framework/eliteforge-agent-capability-macros",
    "crates/framework/eliteforge-agent-capability-runtime",
    "crates/framework/eliteforge-agent-context-contracts",
    "crates/framework/eliteforge-agent-connector",
    "crates/framework/eliteforge-agent-core",
    "crates/framework/eliteforge-agent-framework",
    "crates/framework/eliteforge-agent-plugin-core",
    "crates/plugin/context/eliteforge-agent-context",
    "crates/plugin/connector/eliteforge-agent-official-plugin-connector-github",
    "crates/plugin/connector/eliteforge-agent-official-plugin-connector-gitlab",
    "crates/plugin/connector/eliteforge-agent-official-plugin-connector-gitee",
    "crates/plugin/memory/eliteforge-agent-memory",
    "crates/plugin/model/eliteforge-agent-official-plugin-model-genai",
    "crates/plugin/model/eliteforge-agent-official-plugin-model-http",
    "crates/plugin/agent/eliteforge-agent-official-plugin-agent-external",
    "crates/plugin/observe/eliteforge-agent-official-plugin-otel",
    "crates/plugin/observe/eliteforge-agent-official-plugin-otel-collector",
    "crates/plugin/protocol/eliteforge-agent-official-plugin-agui",
    "crates/plugin/protocol/eliteforge-agent-official-plugin-a2ui",
    "crates/plugin/skill/eliteforge-agent-official-plugin-skills",
    "crates/plugin/storage/eliteforge-agent-official-plugin-storage-local",
    "crates/plugin/tool/eliteforge-agent-official-plugin-tools-agents",
    "crates/plugin/tool/eliteforge-agent-official-plugin-tools-discovery",
    "crates/plugin/tool/eliteforge-agent-official-plugin-tools-human",
    "crates/plugin/tool/eliteforge-agent-official-plugin-tools-local",
    "crates/plugin/tool/eliteforge-agent-official-plugin-tools-mcp",
    "crates/plugin/tool/eliteforge-agent-official-plugin-tools-media",
    "crates/plugin/tool/eliteforge-agent-official-plugin-tools-web",
    "crates/capability/eliteforge-agent-capability-tools",
    "crates/remote/eliteforge-agent-remote-protocol",
    "crates/remote/eliteforge-agent-remote-rpc",
    "crates/remote/eliteforge-agent-remote-server",
    "crates/capability/eliteforge-agent-official-capability-pack",
    "crates/testing/eliteforge-agent-capability-test-fixture",
    "crates/testing/eliteforge-agent-test-support",
    "crates/tools/eliteforge-agent-capability-dev-host",
    "integration-tests",
]
resolver = "2"

[workspace.package]
license = "AGPL-3.0-only"
repository = "https://gitee.com/person-ai/eliteforge-agent-framework"
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
inventory = "0.3.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
